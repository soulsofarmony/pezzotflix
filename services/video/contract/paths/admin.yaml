roots:
  get:
    operationId: listLibraryRoots
    tags: [admin]
    security: []
    summary: ListLibraryRoots (configured from env in the MVP).
    responses:
      '200':
        description: Roots.
        content:
          application/json:
            schema:
              type: object
              required: [roots]
              properties:
                roots: { type: array, items: { $ref: '../components/schemas.yaml#/LibraryRoot' } }
confirmRootContents:
  parameters:
    - { name: rootId, in: path, required: true, schema: { type: string } }
  post:
    operationId: confirmRootContents
    tags: [admin]
    security: []
    summary: >-
      ConfirmRootContents — the owner confirms that the files a held root lacks were really removed.
      A root held offline by the unmounted-root guard (LibraryRoot.held) gets a scan that marks up to
      held.missingFiles absent files missing; if more are absent by then, the root is held again.
    responses:
      '202':
        description: Confirmation recorded, scan queued.
        content:
          application/json:
            schema: { $ref: '../components/schemas.yaml#/Accepted' }
      '404': { $ref: '../components/responses.yaml#/Problem' }
      '409': { $ref: '../components/responses.yaml#/Problem' }
forgetMissingFiles:
  parameters:
    - { name: rootId, in: path, required: true, schema: { type: string } }
  post:
    operationId: forgetMissingFiles
    tags: [admin]
    security: []
    summary: >-
      ForgetMissingFiles — every missing file of the root becomes removed, as ForgetMediaFile does for one.
      Refused with 409 CONFLICT while the root is offline or held (LibraryRoot.held): the files of a root the
      unmounted-root guard sees as unmounted are not forgotten in bulk. The guard sees the root as a whole: a
      separate disk mounted in a subfolder of the root that goes away looks like deleted files.
    responses:
      '200':
        description: Files forgotten (0 when the root had none missing).
        content:
          application/json:
            schema: { $ref: '../components/schemas.yaml#/ForgetResult' }
      '404': { $ref: '../components/responses.yaml#/Problem' }
      '409': { $ref: '../components/responses.yaml#/Problem' }
scan:
  post:
    operationId: triggerScan
    tags: [admin]
    security: []
    summary: TriggerScan — one root or all. Idempotent while a scan is queued.
    requestBody:
      required: false
      content:
        application/json:
          schema: { $ref: '../components/schemas.yaml#/ScanRequest' }
    responses:
      '202':
        description: Scan queued.
        content:
          application/json:
            schema: { $ref: '../components/schemas.yaml#/Accepted' }
      '404': { $ref: '../components/responses.yaml#/Problem' }
ingest:
  get:
    operationId: getIngestStatus
    tags: [admin]
    security: []
    responses:
      '200':
        description: Ingest status.
        content:
          application/json:
            schema: { $ref: '../components/schemas.yaml#/IngestStatus' }
retryJob:
  parameters:
    - { name: jobId, in: path, required: true, schema: { type: string } }
  post:
    operationId: retryJob
    tags: [admin]
    security: []
    responses:
      '202':
        description: Re-queued.
        content:
          application/json:
            schema: { $ref: '../components/schemas.yaml#/Accepted' }
      '404': { $ref: '../components/responses.yaml#/Problem' }
cases:
  get:
    operationId: listIdentificationCases
    tags: [admin]
    security: []
    summary: ListIdentificationCases — the "Da verificare" queue.
    parameters:
      - { name: state, in: query, schema: { type: string, enum: [pending, auto_matched, needs_review, resolved, ignored], default: needs_review } }
      - { $ref: '../components/parameters.yaml#/Cursor' }
      - { $ref: '../components/parameters.yaml#/Limit' }
    responses:
      '200':
        description: Cases.
        content:
          application/json:
            schema: { $ref: '../components/schemas.yaml#/CasePage' }
      '400': { $ref: '../components/responses.yaml#/Problem' }
case:
  parameters:
    - { $ref: '../components/parameters.yaml#/CaseId' }
  get:
    operationId: getIdentificationCase
    tags: [admin]
    security: []
    responses:
      '200':
        description: Case with candidates and evidence.
        content:
          application/json:
            schema: { $ref: '../components/schemas.yaml#/IdentificationCase' }
      '404': { $ref: '../components/responses.yaml#/Problem' }
resolve:
  parameters:
    - { $ref: '../components/parameters.yaml#/CaseId' }
  post:
    operationId: resolveCase
    tags: [admin]
    security: []
    summary: ResolveCase — link to a candidate, an existing item, or a new manual item.
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: '../components/schemas.yaml#/ResolveCaseRequest' }
    responses:
      '200':
        description: Resolved case.
        content:
          application/json:
            schema: { $ref: '../components/schemas.yaml#/IdentificationCase' }
      '400': { $ref: '../components/responses.yaml#/Problem' }
      '404': { $ref: '../components/responses.yaml#/Problem' }
      '409': { $ref: '../components/responses.yaml#/Problem' }
      '503': { $ref: '../components/responses.yaml#/Problem' }
ignore:
  parameters:
    - { $ref: '../components/parameters.yaml#/CaseId' }
  post:
    operationId: ignoreCase
    tags: [admin]
    security: []
    responses:
      '200':
        description: Ignored case.
        content:
          application/json:
            schema: { $ref: '../components/schemas.yaml#/IdentificationCase' }
      '404': { $ref: '../components/responses.yaml#/Problem' }
providerSearch:
  get:
    operationId: searchProvider
    tags: [admin]
    security: []
    summary: SearchProvider — manual match lookup (Wikidata, TMDB when configured).
    parameters:
      - { name: q, in: query, required: true, schema: { type: string, minLength: 1, maxLength: 200 } }
      - { name: kind, in: query, schema: { type: string, enum: [movie, series] } }
      - { name: year, in: query, schema: { type: integer } }
    responses:
      '200':
        description: Candidates.
        content:
          application/json:
            schema: { $ref: '../components/schemas.yaml#/ProviderSearchResult' }
      '503': { $ref: '../components/responses.yaml#/Problem' }
file:
  parameters:
    - { $ref: '../components/parameters.yaml#/FileId' }
  get:
    operationId: getMediaFileDetails
    tags: [admin]
    security: []
    responses:
      '200':
        description: File details with all tracks.
        content:
          application/json:
            schema: { $ref: '../components/schemas.yaml#/MediaFileDetails' }
      '404': { $ref: '../components/responses.yaml#/Problem' }
files:
  get:
    operationId: listMediaFiles
    tags: [admin]
    security: []
    summary: >-
      ListMediaFiles — the media files in one state, newest missing first. Only state=missing is supported for
      now: the files a scan found gone, with the catalog items they are linked to. Such an item shows as not
      available until its file comes back or is forgotten (ForgetMediaFile); autoRemoveAfterDays says when
      missing files are forgotten by themselves.
    parameters:
      - { name: state, in: query, required: true, schema: { type: string, enum: [missing] } }
      - { name: rootId, in: query, required: false, schema: { type: string }, description: Only the files of this root. }
      - { $ref: '../components/parameters.yaml#/Cursor' }
      - { $ref: '../components/parameters.yaml#/Limit' }
    responses:
      '200':
        description: Files.
        content:
          application/json:
            schema: { $ref: '../components/schemas.yaml#/MediaFilePage' }
      '400': { $ref: '../components/responses.yaml#/Problem' }
      '404':
        $ref: '../components/responses.yaml#/Problem'
        description: NOT_FOUND, an unknown rootId.
forgetFile:
  parameters:
    - { $ref: '../components/parameters.yaml#/FileId' }
  post:
    operationId: forgetMediaFile
    tags: [admin]
    security: []
    summary: >-
      ForgetMediaFile — the owner says a missing file is gone on purpose: it becomes removed (doc 01 §6.1). Its
      links, its identification case and every profile's watch state stay, so the same file coming back (same
      fingerprint) revives with them. Items left with no other file are hidden from Home, lists and search
      (library.item_updated, reason media_removed); its case leaves the "Da verificare" queue. Only a missing
      file can be forgotten: any other state is 409 CONFLICT. It works whatever the state of the file's root
      (offline or held too); only ForgetMissingFiles and the automatic removal need a root that is online and
      not held.
    responses:
      '200':
        description: Forgotten (forgotten is 1).
        content:
          application/json:
            schema: { $ref: '../components/schemas.yaml#/ForgetResult' }
      '404': { $ref: '../components/responses.yaml#/Problem' }
      '409': { $ref: '../components/responses.yaml#/Problem' }
explain:
  post:
    operationId: explainPlaybackDecision
    tags: [admin]
    security: []
    summary: ExplainPlaybackDecision — Decision Engine output without starting anything.
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: '../components/schemas.yaml#/ExplainRequest' }
    responses:
      '200':
        description: Plan and reasons.
        content:
          application/json:
            schema: { $ref: '../components/schemas.yaml#/PlaybackPlanExplanation' }
      '400':
        $ref: '../components/responses.yaml#/Problem'
        description: VALIDATION_FAILED, for example track ids without fileId on an item with several versions.
      '404': { $ref: '../components/responses.yaml#/Problem' }
