sessions:
  get:
    operationId: listActiveSessions
    tags: [playback]
    responses:
      '200':
        description: Active sessions.
        content:
          application/json:
            schema:
              type: object
              required: [sessions]
              properties:
                sessions: { type: array, items: { $ref: '../components/schemas.yaml#/ActiveSession' } }
  post:
    operationId: startPlayback
    tags: [playback]
    summary: StartPlayback — the Decision Engine plans the minimum transformation and returns data-plane locators.
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: '../components/schemas.yaml#/StartPlaybackRequest' }
    responses:
      '201':
        description: Session started.
        content:
          application/json:
            schema: { $ref: '../components/schemas.yaml#/PlaybackSession' }
      '400': { $ref: '../components/responses.yaml#/Problem' }
      '404': { $ref: '../components/responses.yaml#/Problem' }
      '409': { $ref: '../components/responses.yaml#/Problem' }
      '422': { $ref: '../components/responses.yaml#/Problem' }
      '500':
        $ref: '../components/responses.yaml#/Problem'
        description: STREAM_FAILED, the stream could not be produced and the automatic attempts are used up.
      '503':
        $ref: '../components/responses.yaml#/ProblemRetryAfter'
        description: >-
          MEDIA_UNAVAILABLE, or STREAM_PREPARING when the file's keyframe index is not ready and needs a slow
          probe; the index job is moved to the front of the queue and the client shows "preparing" and retries
          after Retry-After (ADR 0003).
session:
  parameters:
    - { $ref: '../components/parameters.yaml#/SessionId' }
  delete:
    operationId: terminateSession
    tags: [playback]
    summary: Terminate a session (also another profile's, to free the slot). Idempotent.
    responses:
      '204': { $ref: '../components/responses.yaml#/NoContent' }
progress:
  parameters:
    - { $ref: '../components/parameters.yaml#/SessionId' }
  post:
    operationId: reportProgress
    tags: [playback]
    summary: ReportProgress — also the heartbeat. The latest client timestamp wins.
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: '../components/schemas.yaml#/ProgressReport' }
    responses:
      '204': { $ref: '../components/responses.yaml#/NoContent' }
      '404': { $ref: '../components/responses.yaml#/Problem' }
      '410': { $ref: '../components/responses.yaml#/Problem' }
stop:
  parameters:
    - { $ref: '../components/parameters.yaml#/SessionId' }
  post:
    operationId: stopPlayback
    tags: [playback]
    summary: StopPlayback — closes the ViewingRecord and updates WatchState (90%). Idempotent.
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: '../components/schemas.yaml#/StopRequest' }
    responses:
      '204': { $ref: '../components/responses.yaml#/NoContent' }
tracks:
  parameters:
    - { $ref: '../components/parameters.yaml#/SessionId' }
  post:
    operationId: changeTracks
    tags: [playback]
    summary: ChangeTracks — may re-plan (new locators, possibly a different mode).
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: '../components/schemas.yaml#/ChangeTracksRequest' }
    responses:
      '200':
        description: Updated session.
        content:
          application/json:
            schema: { $ref: '../components/schemas.yaml#/PlaybackSession' }
      '404': { $ref: '../components/responses.yaml#/Problem' }
      '410': { $ref: '../components/responses.yaml#/Problem' }
      '422':
        $ref: '../components/responses.yaml#/Problem'
        description: >-
          NO_COMPATIBLE_PLAN, the change is refused. Normally the session goes on with its current tracks. With
          sessionClosed true the session was waiting without a stream, its previous tracks failed too and it is
          now closed: start a new session.
      '500':
        $ref: '../components/responses.yaml#/Problem'
        description: STREAM_FAILED, the stream could not be produced and the automatic attempts are used up.
      '503':
        $ref: '../components/responses.yaml#/ProblemRetryAfter'
        description: >-
          STREAM_PREPARING (the new stream's keyframe index is not ready; the session stays open without a
          stream, retry the same request after Retry-After) or MEDIA_UNAVAILABLE.
version:
  parameters:
    - { $ref: '../components/parameters.yaml#/SessionId' }
  post:
    operationId: changeVersion
    tags: [playback]
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: '../components/schemas.yaml#/ChangeVersionRequest' }
    responses:
      '200':
        description: Updated session.
        content:
          application/json:
            schema: { $ref: '../components/schemas.yaml#/PlaybackSession' }
      '404': { $ref: '../components/responses.yaml#/Problem' }
      '410': { $ref: '../components/responses.yaml#/Problem' }
      '422':
        $ref: '../components/responses.yaml#/Problem'
        description: >-
          NO_COMPATIBLE_PLAN, the version is refused. Normally the session goes on with its current version. With
          sessionClosed true the session was waiting without a stream, its previous version failed too and it is
          now closed: start a new session.
      '500':
        $ref: '../components/responses.yaml#/Problem'
        description: STREAM_FAILED, the stream could not be produced and the automatic attempts are used up.
      '503':
        $ref: '../components/responses.yaml#/ProblemRetryAfter'
        description: >-
          STREAM_PREPARING (the new stream's keyframe index is not ready; the session stays open without a
          stream, retry the same request after Retry-After) or MEDIA_UNAVAILABLE.
failure:
  parameters:
    - { $ref: '../components/parameters.yaml#/SessionId' }
  post:
    operationId: reportPlaybackFailure
    tags: [playback]
    summary: Client playback failure — the server re-plans from the suspect dimension with the minimum change (doc 04 §8).
    description: >-
      The failed format stays excluded for the session. audio: one step down the audio ladder (Direct Play
      becomes Direct Stream with converted audio; Direct Stream stays Direct Stream with another audio format).
      subtitle: the next subtitle treatment; if there is none (e.g. burn-in on a 4K source), playback goes on
      without that track and the session reasons say why. video, container or unknown: a heavier mode
      (Direct Play, Direct Stream, Transcode). If the required step does not exist (4K Transcode), 422
      NO_COMPATIBLE_PLAN.
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: '../components/schemas.yaml#/FallbackRequest' }
    responses:
      '200':
        description: Re-planned session.
        content:
          application/json:
            schema: { $ref: '../components/schemas.yaml#/PlaybackSession' }
      '404': { $ref: '../components/responses.yaml#/Problem' }
      '410': { $ref: '../components/responses.yaml#/Problem' }
      '422': { $ref: '../components/responses.yaml#/Problem' }
      '500':
        $ref: '../components/responses.yaml#/Problem'
        description: STREAM_FAILED, the stream could not be produced and the automatic attempts are used up.
      '503':
        $ref: '../components/responses.yaml#/ProblemRetryAfter'
        description: >-
          STREAM_PREPARING (the new stream's keyframe index is not ready; the session stays open without a
          stream, retry the same request after Retry-After) or MEDIA_UNAVAILABLE.
