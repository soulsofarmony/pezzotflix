# Data plane (doc 03 §5). Session resources are authorized by the token in the path (P9);
# they stop working when the session closes. Images do not depend on a session.
# HEAD is served automatically for every GET route.
file:
  parameters:
    - { $ref: '../components/parameters.yaml#/SessionToken' }
  get:
    operationId: getMediaFile
    tags: [media]
    security: []
    summary: Direct Play — the original file bytes, with Range support.
    description: >-
      Read-only, with Range, ETag and Last-Modified; every answer, errors included, has Cache-Control no-store.
    parameters:
      - { name: Range, in: header, required: false, schema: { type: string } }
    responses:
      '200': { description: Whole file. }
      '206': { description: Partial content. }
      '304': { description: Not modified (If-None-Match or If-Modified-Since). }
      '400': { $ref: '../components/responses.yaml#/Problem' }
      '404': { $ref: '../components/responses.yaml#/Problem' }
      '410': { $ref: '../components/responses.yaml#/Problem' }
      '412': { description: Precondition failed (If-Match or If-Unmodified-Since). }
      '416': { description: Range not satisfiable. }
      '500': { $ref: '../components/responses.yaml#/Problem' }
      '503':
        $ref: '../components/responses.yaml#/Problem'
        description: MEDIA_UNAVAILABLE, the file is no longer reachable or readable.
hls:
  parameters:
    - { $ref: '../components/parameters.yaml#/SessionToken' }
    - name: resource
      in: path
      required: true
      schema: { type: string, pattern: '^[A-Za-z0-9_.-]{1,64}$' }
      description: >-
        Multivariant playlist (main.m3u8), media playlist (media-N.m3u8), init segment (init-N.mp4) or media
        segment (seg-N-NNNNN.m4s); N is the rendition index.
  get:
    operationId: getHlsResource
    tags: [media]
    security: []
    summary: Direct Stream / Transcode — HLS fMP4 playlist or segment.
    description: >-
      Segments are produced on demand. A resource listed in the playlist never answers 404 while the session is
      alive: if it is not ready in time the answer is 503 with Retry-After, and the client retries. 404 is only
      for a name that is not in the playlist; 410 once the session is closed or re-planned (new token) (ADR 0003).
    responses:
      '200': { description: Playlist or segment. }
      '206': { description: Partial content of an init or media segment. }
      '304': { description: Not modified (init and media segments). }
      '400': { $ref: '../components/responses.yaml#/Problem' }
      '404': { $ref: '../components/responses.yaml#/Problem' }
      '410': { $ref: '../components/responses.yaml#/Problem' }
      '412': { description: Precondition failed. }
      '416': { description: Range not satisfiable. }
      '500':
        $ref: '../components/responses.yaml#/Problem'
        description: >-
          STREAM_FAILED, after one automatic retry by the server. Terminal for the stream: every later data-plane
          request of the session answers 500 STREAM_FAILED at once; recovery is only through reportPlaybackFailure.
      '503': { $ref: '../components/responses.yaml#/ProblemRetryAfter' }
subtitle:
  parameters:
    - { $ref: '../components/parameters.yaml#/SessionToken' }
    - name: track
      in: path
      required: true
      schema: { type: string, pattern: '^[A-Za-z0-9_:.-]{1,64}$' }
      description: 'Track id plus format extension, e.g. s5.vtt or s7.sup.'
  get:
    operationId: getSubtitle
    tags: [media]
    security: []
    summary: Sidecar or extracted subtitle track (WebVTT for text, PGS .sup for client rendering).
    description: >-
      While the track's availability is growing, the answer is a single streamed response without Content-Length
      that grows until the extraction's first pass ends, then the first pass's file until the merge completes;
      a streamed response is cut (not ended cleanly) if its pass fails or starts over. While the extraction is
      queued behind another one, an embedded track answers 503 STREAM_PREPARING with Retry-After. Once complete,
      the same url serves the whole file with Range, or answers 503 MEDIA_UNAVAILABLE if the extraction failed
      for good (ADR 0003).
    responses:
      '200': { description: Subtitle data. }
      '206': { description: 'Partial content of a file: a sidecar served as is (.sup, .vtt), an extracted track, or the first pass''s file.' }
      '304': { description: Not modified (any response served from a file with Range). }
      '400': { $ref: '../components/responses.yaml#/Problem' }
      '404': { $ref: '../components/responses.yaml#/Problem' }
      '410': { $ref: '../components/responses.yaml#/Problem' }
      '412': { description: Precondition failed (any response served from a file with Range). }
      '416': { description: Range not satisfiable (any response served from a file with Range). }
      '500':
        $ref: '../components/responses.yaml#/Problem'
        description: STREAM_FAILED, terminal for the stream (see getHlsResource).
      '503':
        $ref: '../components/responses.yaml#/ProblemRetryAfter'
        description: >-
          STREAM_PREPARING with Retry-After (the embedded track's extraction is queued), or MEDIA_UNAVAILABLE.
          MEDIA_UNAVAILABLE with Retry-After is transient (the sidecar or the extracted file is briefly unreachable
          or not readable): retry like STREAM_PREPARING. Without Retry-After it is final for this stream (the
          extraction failed for good, or the sidecar could not be converted): re-plan without the track.
image:
  parameters:
    - name: imageKey
      in: path
      required: true
      schema: { type: string, pattern: '^[A-Za-z0-9_-]{8,128}$' }
      description: Content-addressed key (hash); a changed image gets a new URL.
    - name: w
      in: query
      required: false
      schema: { type: integer, enum: [160, 320, 640, 1280, 1920] }
  get:
    operationId: getImage
    tags: [media]
    security: []
    summary: GetImage — size variant (WebP). Cache policy per ADR 0004 (immutable except TMDB images).
    responses:
      '200': { description: Image bytes. }
      '404': { $ref: '../components/responses.yaml#/Problem' }
