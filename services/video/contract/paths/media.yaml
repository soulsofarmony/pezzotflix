# Data plane (doc 03 §5). Session resources are authorized by the token in the path (P9);
# they stop working when the session closes. Images do not depend on a session.
# HEAD is served automatically for every GET route.
file:
  parameters:
    - { $ref: '../components/parameters.yaml#/SessionToken' }
  get:
    operationId: getMediaFile
    tags: [media]
    security: []
    summary: Direct Play — the original file bytes, with Range support.
    parameters:
      - { name: Range, in: header, required: false, schema: { type: string } }
    responses:
      '200': { description: Whole file. }
      '206': { description: Partial content. }
      '404': { $ref: '../components/responses.yaml#/Problem' }
      '410': { $ref: '../components/responses.yaml#/Problem' }
      '416': { description: Range not satisfiable. }
hls:
  parameters:
    - { $ref: '../components/parameters.yaml#/SessionToken' }
    - name: resource
      in: path
      required: true
      schema: { type: string, pattern: '^[A-Za-z0-9_.-]{1,64}$' }
      description: >-
        Multivariant playlist (main.m3u8), media playlist (media-N.m3u8), init segment (init-N.mp4) or media
        segment (seg-N-NNNNN.m4s); N is the rendition index.
  get:
    operationId: getHlsResource
    tags: [media]
    security: []
    summary: Direct Stream / Transcode — HLS fMP4 playlist or segment.
    description: >-
      Segments are produced on demand. A resource listed in the playlist never answers 404 while the session is
      alive: if it is not ready in time the answer is 503 with Retry-After, and the client retries. 404 is only
      for a name that is not in the playlist; 410 once the session is closed or re-planned (new token) (ADR 0003).
    responses:
      '200': { description: Playlist or segment. }
      '404': { $ref: '../components/responses.yaml#/Problem' }
      '410': { $ref: '../components/responses.yaml#/Problem' }
      '500':
        $ref: '../components/responses.yaml#/Problem'
        description: >-
          STREAM_FAILED, after one automatic retry by the server. Terminal for the stream: every later data-plane
          request of the session answers 500 STREAM_FAILED at once; recovery is only through reportPlaybackFailure.
      '503': { $ref: '../components/responses.yaml#/ProblemRetryAfter' }
subtitle:
  parameters:
    - { $ref: '../components/parameters.yaml#/SessionToken' }
    - name: track
      in: path
      required: true
      schema: { type: string, pattern: '^[A-Za-z0-9_:.-]{1,64}$' }
      description: 'Track id plus format extension, e.g. s5.vtt or s7.sup.'
  get:
    operationId: getSubtitle
    tags: [media]
    security: []
    summary: Sidecar or extracted subtitle track (WebVTT for text, PGS .sup for client rendering).
    description: >-
      While the track's availability is growing, the answer is a single streamed response without Content-Length
      that grows until the extraction's first pass ends; if the extraction is queued, the response stays open
      with no bytes until it starts. Once complete, the same url serves the whole file with
      Range (ADR 0003).
    responses:
      '200': { description: Subtitle data. }
      '404': { $ref: '../components/responses.yaml#/Problem' }
      '410': { $ref: '../components/responses.yaml#/Problem' }
image:
  parameters:
    - name: imageKey
      in: path
      required: true
      schema: { type: string, pattern: '^[A-Za-z0-9_-]{8,128}$' }
      description: Content-addressed key (hash); a changed image gets a new URL.
    - name: w
      in: query
      required: false
      schema: { type: integer, enum: [160, 320, 640, 1280, 1920] }
  get:
    operationId: getImage
    tags: [media]
    security: []
    summary: GetImage — size variant (WebP). Cache policy per ADR 0004 (immutable except TMDB images).
    responses:
      '200': { description: Image bytes. }
      '404': { $ref: '../components/responses.yaml#/Problem' }
