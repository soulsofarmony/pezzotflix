# Pezzotflix — Docker Compose (ADR 0006). Run from the repo root (see deploy/README.md):
#   docker compose -f deploy/compose.yaml --env-file .env up -d --build
# Optional overrides from the shell: COMPOSE_PROJECT_NAME (another stack next to this one), PZF_IMAGE_TAG
# (image tag, default dev), PZF_ENV_FILE (the app's .env, default the repo-root one).
name: pezzotflix

# Docker's json-file logs grow without bound otherwise (the health check alone logs a line every 10 s).
x-logging: &logging
  driver: json-file
  options: { max-size: 10m, max-file: "3" }

services:
  gateway:
    build:
      context: ..
      dockerfile: deploy/gateway.Dockerfile
    image: pezzotflix/gateway:${PZF_IMAGE_TAG:-dev}
    # Built here, never pulled: neither `docker compose pull` nor an `up` with the image missing may fetch someone
    # else's pezzotflix/* from Docker Hub. A missing image is built. Not `build`: that rebuilds on every `up -d` and,
    # since the rebuilt image gets a new id, recreates the containers (measured on Compose 2.35), so a plain
    # `up -d` would restart the Video Service in the middle of a film.
    pull_policy: never
    restart: unless-stopped
    logging: *logging
    ports:
      - "${HTTP_PORT:-8080}:8080"
    environment:
      # Host names accepted besides IP literals and localhost (DNS rebinding guard in the Caddyfile).
      PZF_HOSTS: ${PZF_HOSTS:-}
    volumes:
      - gateway-data:/data
    networks: [platform]

  video:
    build:
      context: ..
      dockerfile: deploy/video.Dockerfile
    image: pezzotflix/video:${PZF_IMAGE_TAG:-dev}
    pull_policy: never
    restart: unless-stopped
    logging: *logging
    init: true
    # Fixed: the named volumes are created owned by uid 1000 from the image. Reading the media takes a group
    # instead: MEDIA_GID, the group that can read MEDIA_DIR on a Linux or NAS host.
    user: "1000:1000"
    group_add: ["${MEDIA_GID:-1000}"]
    # App settings come from the repo-root .env (see .env.example); unset keys use the defaults in config.ts.
    env_file:
      - path: ${PZF_ENV_FILE:-../.env}
        required: false
    volumes:
      # Media library: read-only, always (architectural invariant). A wrong MEDIA_DIR fails at `up` instead of
      # mounting an empty folder.
      - type: bind
        source: ${MEDIA_DIR:-../media-samples/library}
        target: /media
        read_only: true
        bind:
          create_host_path: false
      - video-db:/data/db
      - video-cache:/data/cache
      - video-artwork:/data/artwork
      - video-thumbnails:/data/thumbnails
      - video-scratch:/data/scratch
      - video-backup:/data/backup
      # Signing key of the profile tokens: without a volume every rebuild would log every profile out.
      - video-secrets:/data/secrets
    # Not published: only the gateway reaches it. The network is not internal, because Wikidata and TMDB are
    # reached from here (ADR 0007).
    networks: [platform]
    develop:
      watch:
        - action: sync+restart
          path: ../services/video/src
          target: /app/services/video/src
        - action: sync+restart
          path: ../services/video/contract/dist
          target: /app/services/video/contract/dist
        - action: rebuild
          path: ../services/video/package.json

networks:
  # Shared by the services of the platform; the future Music Service joins it too (ADR 0006 point 2).
  platform: {}

volumes:
  gateway-data: {}
  video-db: {}
  video-cache: {}
  video-artwork: {}
  video-thumbnails: {}
  video-scratch: {}
  video-backup: {}
  video-secrets: {}
